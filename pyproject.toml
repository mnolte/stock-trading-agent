[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[project]
name = "stock-trading-agent"
version = "0.2.0"
description = "Paper-only trading agent for US stocks on Alpaca"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "alpaca-py>=0.44.0",
    "apscheduler>=3.11.0",
    "finnhub-python>=2.4.29",
    "pandas>=2.2.3",
    "openai>=1.109,<4",
    "cryptography>=41.0.0",
    "argon2-cffi>=23.1.0",
    "qrcode>=7.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-pyyaml>=6.0.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "E722", "BLE001", "S", "TRY400", "TRY203", "DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["finnhub", "apscheduler.*", "qrcode"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--disable-socket --allow-unix-socket --strict-markers --timeout=600"
markers = [
    "slow: multi-minute tests (e.g. the 3-month replay) — run with make test-slow",
    "perf: timing-budget tests — run serially with make test-perf",
]

[tool.ruff.lint.per-file-ignores]
# pytest runs on asserts; every noqa elsewhere carries a reason comment.
"backend/tests/**" = ["S101", "S104", "S311", "S603", "S607", "S608", "S105", "S106", "S108", "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ007", "DTZ011", "DTZ012", "DTZ901"]
# Merged migrations are immutable; their fixed schema SQL is not input-driven.
"backend/alembic/versions/**" = ["S608"]
