# Stock Trading Agent on the VPS (docs/SPEC.md → VPS deployment).
# Two containers on one internal network: caddy is the only public
# entry point; app is never published.
name: stock-agent

networks:
  internal:
    driver: bridge
    ipam:
      config:
        # Fixed subnet so SA_TRUSTED_PROXY can name Caddy exactly.
        - subnet: 172.30.4.0/24

volumes:
  data:
  caddy_data:
  caddy_config:
  flags: # PR 25 maintenance flag lives here (deploy/restore scripts)

services:
  app:
    build:
      context: .
      target: runtime
    image: ghcr.io/mnolte/stock-agent:${SA_VERSION:-dev}
    container_name: stock-agent-app
    restart: unless-stopped
    # Longer than the 60 s graceful shutdown, so docker stop never cuts
    # a cycle or an order submission.
    stop_grace_period: 90s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Measured peak under a backtest + live check in the container:
    # ~160 MiB → 512m leaves >3x headroom.
    mem_limit: 512m
    networks:
      - internal
    volumes:
      - data:/data
    environment:
      MODE: ${MODE:-paper}
      SA_HOST: 0.0.0.0
      SA_PORT: "8000"
      SA_DATA_DIR: /data
      SA_DB_PATH: /data/stock-agent.db
      SA_AUTH: required
      SA_PUBLIC_URL: ${SA_PUBLIC_URL:?set SA_PUBLIC_URL in .env}
      SA_TRUSTED_PROXY: 172.30.4.10 # Caddy's address on the internal network
      SA_INSTANCE_ID: sa-vps-1
      SA_VERSION: ${SA_VERSION:-dev}
      SA_DEPLOYED_AT: ${SA_DEPLOYED_AT:-}
    healthcheck:
      # localhost:SA_PORT is a Host the PR 28 request gate accepts.
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request;urllib.request.urlopen('http://localhost:'+os.environ['SA_PORT']+'/healthz',timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    container_name: stock-agent-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      internal:
        ipv4_address: 172.30.4.10
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/errors:/errors:ro
      - caddy_data:/data
      - caddy_config:/config
      - flags:/flags
    environment:
      SA_DOMAIN: ${SA_DOMAIN:?set SA_DOMAIN in .env}
    depends_on:
      app:
        condition: service_started
