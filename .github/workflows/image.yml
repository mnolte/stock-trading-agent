name: Image

# PR 24: build a versioned image for every tag, run the tests in the
# image and push it to the private registry (ghcr.io).
on:
  push:
    tags: ["v*"]
  pull_request: # image test + compose test on every PR; push only on tags

permissions:
  contents: read

jobs:
  test-image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build test image
        run: docker build --target test -t stock-agent-test:ci .
      - name: Run the suite inside the image
        run: docker run --rm stock-agent-test:ci

  compose-test:
    # The through-Caddy stack test — in CI only, never in unit tests.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the full stack through Caddy
        run: deploy/test-compose.sh
      - name: Show compose logs on failure
        if: failure()
        env:
          SA_PUBLIC_URL: https://localhost
          SA_DOMAIN: localhost
        run: docker compose -f docker-compose.yml -f docker-compose.local.yml logs --no-color || true

  push-image:
    needs: [test-image, compose-test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push the image — the only job that needs it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/stock-agent
          tags: |
            type=raw,value={{tag}}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
