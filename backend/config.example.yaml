# Stock Trading Agent configuration. Copy to config.yaml.
# Every value here is a default from docs/SPEC.md. Change behaviour here, not in code.
# Secrets never go in this file; they live in .env.

universe:
  symbols: [SPY, QQQ, AAPL, MSFT, NVDA, AMZN, GOOGL, META, JPM, XOM]
  names:                        # PR 34: company names for headline about_symbol
    SPY: SPDR S&P 500
    QQQ: Invesco QQQ
    AAPL: Apple
    MSFT: Microsoft
    NVDA: Nvidia
    AMZN: Amazon
    GOOGL: Alphabet
    META: Meta
    JPM: JPMorgan
    XOM: Exxon Mobil
  sectors:
    SPY: Index
    QQQ: Technology
    AAPL: Technology
    MSFT: Technology
    NVDA: Technology
    AMZN: Consumer Discretionary
    GOOGL: Communication Services
    META: Communication Services
    JPM: Financials
    XOM: Energy
  mode: fixed                   # fixed (v0.1 list above) | screened (v0.2: daily screen over the pool)
  pool_file: backend/universe/pool.csv   # defaults; loaded once into universe_pool
  max_pool: 150
  screen:
    time_ny: "08:10"            # trading days, after the daily bars refresh
    min_price: 10
    min_avg_dollar_volume: 100000000
    lookback_sessions: 20       # dollar volume and rank
    drop_after_failed_screens: 3
  rank_by: return_vs_spy        # 20-session return minus SPY's
  watchlist_rows: 15            # dashboard rows in screened mode before "Show all"
  allowed_sectors: [Communication Services, Consumer Discretionary, Consumer Staples, Energy, Financials, Health Care, Industrials, Materials, Real Estate, Technology, Utilities, Index]   # 11 GICS sectors (Information Technology written as Technology) + Index

app:
  timezone: Europe/Amsterdam   # GUI, logs, alerts, daily jobs; timestamps are stored in UTC

schedule:
  market_timezone: America/New_York   # cycles follow the exchange clock
  cycles: ["10:46", "11:46", "12:46", "13:46", "14:46", "15:46"]
  last_cycle_no_entries: true
  position_checks: ["09:46", "10:01", "10:16", "10:31", "11:01", "11:16", "11:31", "12:01", "12:16", "12:31", "13:01", "13:16", "13:31", "14:01", "14:16", "14:31", "15:01", "15:16", "15:31"]
  position_check_failures_alert: 3
  calendar_refresh: "08:00"
  misfire_grace_seconds: 120    # missed cycles are never run late
  history_sessions: 60          # 5-minute bars
  daily_history_sessions: 260   # daily bars: SMA 200 + 60-session ATR percentile
  bar_adjustment: split
  bars_5m_keep_sessions: 120   # older 5-min bars deleted after the 03:00 backup
  cycle_duration_warn_minutes: 10

gui:
  near_stop_atr: 1.5          # positions closer to their stop than this turn amber (PR 35)

api:
  broker_timeout_seconds: 5   # GUI reads from Alpaca answer from the last reconciled values (stale) past this

execution:
  mode: automatic            # automatic | supervised (supervised from PR 6; refuses to start before)
  entry_limit_offset_pct: 0.05
  entry_timeout_minutes: 10
  stream_update_grace_seconds: 120   # a fill found by reconciliation whose stream update never arrived within this marks the stream degraded
  stream_degraded_minutes: 30        # the degraded stream banner clears this long after the last failure
  fill_settle_seconds: 10            # no qty check while an entry order works or a fill is this fresh (fills still settling)
  max_spread_pct: 0.15
  quote_max_deviation_pct: 1.0   # last trade vs last closed 5-min bar (price_suspect); bid/ask vs market price (plausible quote)
  quote_max_age_seconds: 60    # IEX last trade must be this fresh (market price); older = price_stale
  tighten_quote_max_age_seconds: 300  # held-position tighten may accept an IEX last trade this old
  time_in_force: gtc

rules:
  rsi_min: 40
  rsi_max: 70
  require_daily_above_sma50: true
  require_ema20_above_ema50: true

regime:
  vol_low_below_pct: 30
  vol_high_above_pct: 70
  block_entries_in: [down_high]

decision:
  model: gpt-4o-mini            # live decisions; any entry in models, OpenAI or Anthropic
  temperature: 0                # OpenAI models only; Claude models use the effort in models
  prompt: decision.v1
  min_confidence_enter: 0.55
  stop_atr_min: 1.5
  stop_atr_max: 4.0
  min_reward_risk: 1.5
  tighten_min_atr_below_price: 0.25   # new stop must sit this far below bid/last/bar close
  breakeven_min_r: 1.0          # every prompt version: no tighten to break-even (locked R <= 0) below this R in profit
  max_calls_per_cycle: 10      # held positions first
  call_timeout_seconds: 30      # no retry; failure = no_call (model_error)
  max_output_tokens: 2048       # per call; Claude thinking counts toward it (PR 29)
  options:                      # PR 21, decision.v2 option builder (strategies' check overrides apply)
    swing_strength: 2           # bars on each side for a swing high or low
    swing_lookback_bars_1h: 60
    swing_lookback_sessions: 60 # daily swings
    max_levels_each_side: 8
    level_buffer_atr: 0.1       # stops sit this far below a level, targets this far below resistance
    atr_stop_multiples: [2.0]   # plain ATR stops next to level-based ones
    target_r_multiples: [2.0, 3.0]
    dedupe_atr: 0.5             # merge stops or targets this close; level-based wins
    max_stops: 3
    max_options: 6
    held_trail_atr: 2.0         # T option: highest 1h close since entry minus this x ATR
  v3:                           # PR 30, decision.v3 strategies only
    min_room_atr: 1.0           # first level in the way at least this x ATR(1h) above the entry limit; strategy-overridable
    room_level_kinds: [swing_high, swing_low, session_high, prior_session_high, prior_session_low]   # vwap and prior close don't count
    min_edge: 0.10              # enter needs confidence >= max(min_confidence_enter, breakeven + min_edge)
    min_stop_move_atr: 0.25     # held: drop stop options that move the stop less than this x ATR
    breakeven_min_r: 1.0        # held: break-even offered only from this R in profit
    held_stop_min_atr: 1.0      # held: trail and swing-low options at least this x ATR below the price
    level_merge_atr: 0.05       # levels this close (x ATR) become one id listing every kind
  v4:                           # PR 34, decision.v4 strategies only
    max_headlines: 12           # headlines sent to the model, most recent first
    max_level_distance_atr: 4.0 # only levels this close (x ATR) are sent, plus option/stop levels
    flip_min_move_atr: 0.5      # flip-flop guard: a smaller move counts as unchanged
    max_confidence_above_anchor: 0.30  # confidence_outlier warning threshold
    checks_gate: false          # strategy override: code-enforced checklist, no model call
  replay:
    confirm_above_usd: 2.0      # make replay refuses above this without --yes; counts toward the backtest cap

selection:                    # PR 33, Entry selection; strategy-overridable
  mode: rank                  # rank (today's behaviour) | expected_profit
  confidence_weight: 0.5      # p = break-even + weight x (confidence - break-even)
  last_slot_min_ev_r: null    # minimum expected R for an entry taking the last free slot; null = off

risk:
  risk_per_trade_pct: 0.5
  max_position_pct: 20
  max_open_risk_pct: 2.5
  max_open_positions: 4
  max_per_sector: 2
  cash_only: true
  daily_loss_limit_pct: 2.0
  losing_streak: 3
  losing_streak_risk_factor: 0.5
  shock_brake_1h_pct: 1.5
  shock_brake_session_pct: 2.5
  earnings_blackout_days: 3
  hold_through_earnings: false
  reentry_same_session: false        # PR 26: no new entry in a symbol closed earlier this session
  drawdown_kill_pct: 8
  adopted_stop_atr: 3                 # protective stop for a position found at Alpaca
  protective_stop_fallback_pct: 3     # when ATR is unavailable
  max_order_pct: 25
  max_orders_per_cycle: 6
  failed_cycles_kill: 3

performance:
  starting_equity: 10000          # checked by "Start new run" after a paper reset (±1%)
  slippage_pct_per_side: 0.05
  benchmark: SPY
  tail:                         # PR 19, Winners and tails card
    bucket_r: 0.5               # R distribution bucket width
    top_share_pct: 20           # "top 20% of trades"
    after_exit_sessions: 5      # window for best and close after exit
    min_trades: 20              # below this the card shows the small-sample banner

reviews:
  weekly_day: saturday
  weekly_time: "10:00"            # app timezone
  briefing_enabled: true
  briefing_time_ny: "09:00"       # trading days only
  verdict_after_sessions: 5
  models:                       # PR 29; any entry in models, OpenAI or Anthropic, per task
    weekly: gpt-4o-mini
    briefing: gpt-4o-mini
    verdict: gpt-4o-mini
  temperature: 0.2              # OpenAI models only
  prompts: {weekly: weekly.v2, briefing: briefing.v1, verdict: verdict.v2}
  min_closed_trades_for_suggestion: 10
  max_words: {weekly_summary: 120, briefing: 80}
  monthly_cost_cap_usd: 2         # separate from trading decisions

notifications:
  repeat_limit_minutes: 30        # same subject; critical alerts are never held back
  quiet_hours: {start: "23:00", end: "08:00"}   # app timezone; only critical alerts are sent
  email:                          # password is entered in Settings and stored encrypted
    smtp_host: ""
    smtp_port: 587
    tls: starttls
    username: ""
    from: ""
    to: ""
  events:                         # channels per event; critical events always include browser
    kill_switch: [browser, email]
    missing_stop: [browser, email]
    reconciliation: [browser, email]
    order_rejected: [browser, email]
    stream_degraded: [browser, email]
    live_decisions_failing: [browser, email]
    clock_check_failing: [browser, email]
    new_error: [browser, email]
    daily_loss_limit: [browser, email]
    shock_brake: [browser]
    source_failing: [browser, email]
    position_checks_failing: [browser, email]
    model_failing: [browser]
    approval_waiting: [browser]
    exit_deferred_or_earnings_exit: [browser]
    trade: []
    daily_briefing: [email]
    weekly_review: [email]
    verdicts_waiting: []

models:                         # PR 29; the only list of models. Prices in USD per million tokens: check the providers' current prices
  gpt-4o-mini:       {provider: openai,    input: 0.15, output: 0.60,  cutoff: "2023-10-31"}
  gpt-4.1-mini:      {provider: openai,    input: 0.40, output: 1.60,  cutoff: "2024-06-01"}
  claude-haiku-5-5:  {provider: anthropic, input: 0.10, output: 0.50,  cutoff: "2026-06-30", effort: low}   # Anthropic lists Haiku "from" this price: check
  claude-sonnet-5-5: {provider: anthropic, input: 2.00, output: 10.00, cutoff: "2026-06-30", effort: low}
# model_prices, backtest.model_cutoffs and reviews.model (before PR 29) are read for one release with a warning

shadows:                        # v0.2, PR 13
  max_active: 3
  monthly_cost_cap_usd: 5         # separate from decisions, reviews and backtests
  promote_min_closed_trades: 20
  rules_only: {stop_atr: 2.0, target_r: 2.0}

backtest:                         # v0.2, PR 14
  monthly_cost_cap_usd: 20
  max_range_years: 3
  alpaca_calls_per_minute: 40     # live keeps 150 of Alpaca's 200; paused during live cycles and checks
  assumed_spread_pct: 0.05        # no historical quotes on the free plan
  same_bar_stop_and_target: stop
  data_dir: data/backtests        # run-<id>/<strategy>.db + market.db per run
  bar_store: data/backtests/bars.db   # never pruned automatically; not in the 03:00 backup
  cancel_grace_seconds: 60        # then the app stops the child by PID
  process_nice: 10

readiness:                      # PR 16; evidence from the current run, adjusted P&L
  min_closed_trades: 100
  min_sessions: 60
  max_drawdown_pct: 6
  min_avg_r: 0.2
  min_profit_factor: 1.3
  ratio_min_trades: 30            # average R, profit factor, beats rules-only
  min_proposal_pass_pct: 75       # last 100 model entry proposals; needs 30
  max_calibration_gap_pts: 10     # needs 50 filled entries; groups of 0.1 with >= 10 entries
  min_cycles_completed_pct: 98    # last 20 sessions
  max_price_blocked_pct: 5        # price_stale + price_suspect, last 20 sessions
  error_auto_resolve_minutes: 60
  log_error_sessions: 10          # PR 20: unreviewed ERROR problems in the log, target 0 (fixed)
  log_critical_sessions: 20       # PR 20: CRITICAL lines in the log, target 0 (fixed); keep within logging.keep_days

insights:                       # PR 22
  min_trades: 30                # a slice can be a finding from here
  early_trades: 10              # 10-29: early signal; below: hidden
  finding_sigma: 2.0            # difference vs the rest, in standard errors
  range_z: 1.64                 # 90% range on averages
  skip_score: {stop_atr: 2.0, target_r: 2.0, sessions: 5}   # rules-only geometry for missed / avoided
  gap_through_stop_r: 0.1       # a stop fill this far below the stop counts as a gap
  spy_flat_pct: 0.3             # "SPY that day" flat band
  opening_gap_pct: 1.0          # opening gap buckets

inspector:                      # PR 18, LLM call history
  page_size: 50                 # calls per page; the API allows up to 100
  slow_call_seconds: 15         # a returned call slower than this gets the warning "slow"
  default_sources: [live, review]   # shadows off by default (they triple the volume)

logging:                        # PR 20, Logging, error handling and shutdown
  dir: data/logs
  file_level: DEBUG             # everything goes to the file
  console_level: INFO
  max_file_mb: 50               # rotate and gzip
  max_files: 20
  keep_days: 30                 # files and the log index
  library_debug: false          # third-party loggers at WARNING unless true
  index: data/logs/logs.db      # separate SQLite file; not in the 03:00 backup
  page_size: 100                # Logs screen; API allows up to 200
  client_errors_per_minute: 10  # frontend errors per tab
  heartbeat_seconds: 30         # data/run.lock heartbeat for unclean-stop detection
  backtest_kill_after_seconds: 10   # on shutdown, after the cancel flag

security:                       # PR 28, request gate and limits (see SPEC → Security hardening)
  allowed_hosts: []             # extra Host names; loopback and the SA_PUBLIC_URL host are always allowed
  max_body_kb: 1024             # JSON request bodies
  max_upload_kb: 5120           # the CSV import
  export_max_rows: 100000       # logs, LLM calls and CSV exports
  client_error_senders: 1000    # addresses remembered for the frontend error rate limit

auth:                           # PR 23; only used when SA_AUTH=required
  idle_hours: 12                # sign out after this long without activity
  remember_days: 30             # "Keep me signed in", absolute maximum
  min_password_length: 14
  lockout_failures: 5           # per address, in lockout_window_minutes
  lockout_window_minutes: 15
  lockout_minutes: 15
  global_failures_per_hour: 20  # across all addresses: sign-in pauses for an hour, warning sent
  confirm_minutes: 5            # "Confirm it is you" stays valid this long on a device
  recovery_codes: 10

ops:                            # PR 24, VPS
  resume_after_clean_restart: auto   # auto = on when SA_AUTH=required, off locally
  heartbeat_url: ""             # dead-man's-switch ping after each cycle and position check
  disk_warn_pct: 80
  disk_critical_pct: 90
  clock_max_offset_seconds: 1
  cert_warn_days: 14
  offsite_backup: {enabled: false, time: "03:05", keep_daily: 30, keep_weekly: 12, restore_test_day: 1}
  deploy_guard_market_hours: true

storage:
  backup_time: "03:00"          # app timezone; SQLite online backup API + integrity_check
  backup_days: 14
  shutdown_grace_seconds: 60     # wait for a running cycle/check on normal shutdown
  sqlite_busy_timeout_seconds: 30  # every connection uses WAL; never hold a write lock across a network call
